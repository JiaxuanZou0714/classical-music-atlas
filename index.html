<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="一张面向古典音乐爱好者的互动时间地图。">
    <title>古典音乐时间地图</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/styles.css">
    <script type="module" src="assets/app.js"></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header" aria-label="站点导航">
      <a class="brand-mark" href="index.html" aria-label="古典音乐时间地图首页">
        <span class="brand-mark__glyph" aria-hidden="true">CT</span>
        <span>
          <span class="brand-mark__title">古典音乐时间地图</span>
          <span class="brand-mark__subtitle">Classical Timeline</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="timeline.html">Timeline</a>
        <a href="timeline.html?period=Romantic">浪漫主义</a>
        <a href="timeline.html?mood=水光">听感索引</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero-shell" aria-labelledby="home-title">
        <div class="hero-copy">
          <p class="kicker">Annotated Concert Map</p>
          <h1 id="home-title">把作曲家放回时间里听。</h1>
          <p class="hero-lede">
            一张可漫游的时间地图，把作曲家、时代和下一首推荐连起来。
          </p>
          <div class="hero-actions" aria-label="主要入口">
            <a class="button button--primary" href="timeline.html">进入 timeline</a>
          </div>
        </div>

        <section class="atlas-panel" aria-labelledby="preview-title">
          <div class="atlas-panel__head">
            <div>
              <p class="kicker">Preview</p>
              <h2 id="preview-title">私人听乐地图</h2>
            </div>
            <a class="text-link" href="timeline.html">展开全图</a>
          </div>
          <div class="timeline-frame timeline-frame--preview" data-timeline-frame="preview" tabindex="0" aria-label="时间线预览，可拖拽或用方向键平移">
            <div class="timeline" data-timeline="preview" aria-label="古典音乐作曲家时间线预览"></div>
          </div>
          <div class="timeline-note timeline-note--quiet" data-preview-note aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>
